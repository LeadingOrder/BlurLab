<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-labelledby="title description">
    <title id="title">Blur Lab</title>
    <desc id="description">Understand blur by constructing it.</desc>
    <defs>
        <radialGradient id="violet-glow" cx="0" cy="0" r="1" gradientTransform="translate(153 84) rotate(38) scale(568 490)" gradientUnits="userSpaceOnUse">
            <stop stop-color="#7C5CFF" stop-opacity="0.3" />
            <stop offset="1" stop-color="#7C5CFF" stop-opacity="0" />
        </radialGradient>
        <radialGradient id="cyan-glow" cx="0" cy="0" r="1" gradientTransform="translate(1090 606) rotate(-142) scale(526 442)" gradientUnits="userSpaceOnUse">
            <stop stop-color="#2EEBFF" stop-opacity="0.16" />
            <stop offset="1" stop-color="#2EEBFF" stop-opacity="0" />
        </radialGradient>
        <linearGradient id="rule" x1="606" y1="0" x2="1022" y2="0" gradientUnits="userSpaceOnUse">
            <stop stop-color="#7C5CFF" />
            <stop offset="0.5" stop-color="#2EEBFF" />
            <stop offset="1" stop-color="#FF3BD4" />
        </linearGradient>
    </defs>
    <g id="layer-background" data-layer="background">
        <rect width="1200" height="630" fill="#030305" />
        <rect width="1200" height="630" fill="url(#violet-glow)" />
        <rect width="1200" height="630" fill="url(#cyan-glow)" />
    </g>
    <g id="layer-logo" data-layer="logo">
        <image href="blurlab-kernel-logo.svg" x="48" y="59" width="512" height="512" />
    </g>
    <g id="layer-wordmark" data-layer="wordmark" font-family="Manrope, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
        <text x="606" y="277" fill="#F5F5FA" font-size="86" font-weight="600" letter-spacing="-3">Blur Lab</text>
        <rect x="606" y="309" width="416" height="5" rx="2.5" fill="url(#rule)" />
        <text x="608" y="369" fill="#A2A4B2" font-size="28" font-weight="400">Understand blur by constructing it.</text>
        <text x="608" y="423" fill="#B7FF3C" font-family="'SF Mono', ui-monospace, monospace" font-size="18" font-weight="600" letter-spacing="3">SPATIAL  ×  FREQUENCY</text>
    </g>
</svg>
